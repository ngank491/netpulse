name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: node --check internal/app/web/app.js

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Build binaries
        run: VERSION=${GITHUB_REF_NAME#v} ./scripts/build.sh
      - name: GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.tar.gz dist/SHA256SUMS --generate-notes
      - id: ver
        name: Version without the leading v (Home Assistant uses it as the image tag)
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: VERSION=${{ steps.ver.outputs.v }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/netpulse:${{ steps.ver.outputs.v }}
            ghcr.io/${{ github.repository_owner }}/netpulse:latest
      - name: Home Assistant image (runs as root for /data)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: |
            VERSION=${{ steps.ver.outputs.v }}
            RUN_USER=0
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/netpulse-ha:${{ steps.ver.outputs.v }}
