name: NetPulse
version: "0.1.0"
slug: netpulse
description: Giám sát MikroTik gọn nhẹ – WAN, thiết bị, sơ đồ, cảnh báo Telegram
url: https://github.com/OWNER/netpulse
arch:
  - amd64
  - aarch64
  - armv7
startup: application
boot: auto
init: false
# Thay OWNER bằng tài khoản GitHub của bạn. Image được CI build với RUN_USER=0
# vì /data của add-on thuộc root.
image: ghcr.io/OWNER/netpulse-ha
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Giao diện web và API nhận dữ liệu từ router (chế độ push)
webui: "[PROTO:https]://[HOST]:[PORT:8080]"
watchdog: "[PROTO:https]://[HOST]:[PORT:8080]/healthz"
options:
  admin_password: ""
  https: false
  trust_proxy: false
schema:
  admin_password: password?
  https: bool
  trust_proxy: bool
