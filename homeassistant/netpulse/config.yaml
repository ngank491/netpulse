name: NetPulse
version: "0.4.1"
slug: netpulse
description: Giám sát MikroTik gọn nhẹ – WAN, thiết bị, sơ đồ, cảnh báo Telegram/Zalo, kiểm tra bảo mật bằng AI
url: https://github.com/ngank491/netpulse
arch:
  - amd64
  - aarch64
  - armv7
startup: application
boot: auto
init: false
# Image được CI build (khi đẩy tag v*) với RUN_USER=0
# vì /data của add-on thuộc root.
image: ghcr.io/ngank491/netpulse-ha
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Giao diện web và API nhận dữ liệu từ router (chế độ push)
webui: "[PROTO:https]://[HOST]:[PORT:8080]"
watchdog: "[PROTO:https]://[HOST]:[PORT:8080]/healthz"
options:
  admin_password: ""
  https: false
  trust_proxy: false
schema:
  admin_password: password?
  https: bool
  trust_proxy: bool
